name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the BSI library republishes continuously. A pinned commit does
    # not change, but this catches a schema or URL that stopped resolving.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  # The BSI library commit every check here is pinned to. Raise it deliberately.
  BSI_COMMIT: 367d775010abee641b258926bb482fcd05270059
  CATALOG: control_layer/Grundschutz++/Grundschutz++-resolved_catalog.json
  MAPPING: control_layer/Mappings/ISO-27001-zu-GSpp/ISO27001-AnnexA-to-GS++-mapping_collection.json

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Validator self-test (valid fixtures pass, broken ones fail)
        run: npm test
      - name: BSI files validate against the NIST schema of their declared version
        run: |
          node validate.mjs --bsi "$CATALOG" --commit "$BSI_COMMIT"
          node validate.mjs --bsi control_layer/Grundschutz++/sources/profiles/Grundschutz++-profile.json --commit "$BSI_COMMIT"
          node validate.mjs --bsi implementation_layer/Keycloak/Keycloak-component_definition.json --commit "$BSI_COMMIT"
      - name: Worksheet smoke test (ISO 27001 mapping yields 280 requirements at the pinned commit)
        run: |
          n=$(node worksheet.mjs "$CATALOG" --mapping "$MAPPING" --summary --commit "$BSI_COMMIT" 2>/dev/null | sed -n 's/^\([0-9]*\) requirements$/\1/p')
          echo "requirements: $n"
          test "$n" = "280"
      - name: A branch name instead of a commit is refused
        run: |
          set +e
          node worksheet.mjs "$CATALOG" --commit main
          test $? -eq 2

  # A second, independent validator: NIST's oscal-cli checks the Metaschema
  # constraints as well, which the JSON schema cannot express (a back-matter
  # resource without content, for example, passes ajv and fails here).
  # Advisory, not binding: the job reports every WARNING or ERROR and turns red,
  # but it does not fail the workflow -- validate.mjs remains the gate.
  # oscal-cli 1.0.3 bundles OSCAL 1.1.2; the 1.2.2 files are checked against
  # that model, which covers what they use but is not a full 1.2.2 check.
  oscal-cli:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      OSCAL_CLI_VERSION: 1.0.3
      OSCAL_CLI_SHA256: c90166b6f94a8b32a4c0012bb3f3d32dfa54b950aed31ac1a4902ce75fc6a57e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install oscal-cli (pinned by version and SHA-256)
        run: |
          curl -fsSL -o oscal-cli.zip "https://repo1.maven.org/maven2/gov/nist/secauto/oscal/tools/oscal-cli/cli-core/${OSCAL_CLI_VERSION}/cli-core-${OSCAL_CLI_VERSION}-oscal-cli.zip"
          echo "${OSCAL_CLI_SHA256}  oscal-cli.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oscal-cli" && unzip -q oscal-cli.zip -d "$RUNNER_TEMP/oscal-cli"
          echo "$RUNNER_TEMP/oscal-cli/bin" >> "$GITHUB_PATH"
      - name: Generate one file per model from the test fixtures
        run: |
          mkdir -p out
          node profile.mjs test/fixtures/tailoring.json > out/profile.json
          node component.mjs test/fixtures/component-source.json --subject "registry.example.org/app@sha256:$(printf 'a%.0s' $(seq 64))" > out/component.json
          node results.mjs test/fixtures/results-run.json --catalog test/fixtures/recheck-catalog.json > out/results.json
          jq '.subjects[1].satisfied=false | .subjects += [{"title":"group hidden","satisfied":false}]' test/fixtures/results-run.json > out/run-fail.json
          node results.mjs out/run-fail.json --catalog test/fixtures/recheck-catalog.json > out/results-fail.json
          npm ci
          npm test >/dev/null   # writes the SSP fixture inputs into .schema-cache
          node ssp.mjs test/fixtures/ssp/system.json > out/ssp.json
          node assessment-plan.mjs test/fixtures/checks.json --catalog test/fixtures/recheck-catalog.json > out/ap.json
      - name: Validate with oscal-cli, warnings count
        run: |
          fail=0
          check() {
            out="$(oscal-cli --no-color "$1" validate "$2" 2>&1)"; rc=$?
            echo "$out" | grep -E 'WARNING|ERROR|valid' || true
            if [ $rc -ne 0 ] || echo "$out" | grep -qE 'WARNING|ERROR'; then fail=1; fi
          }
          check profile out/profile.json
          check component-definition out/component.json
          check ar out/results.json
          check ar out/results-fail.json
          check ssp out/ssp.json
          check ap out/ap.json
          exit $fail

  # Cross-check with compliance-trestle, advisory like oscal-cli: can another
  # OSCAL implementation read what ssp.mjs writes? trestle has known gaps with
  # this data (v5 UUIDs in ssp-assemble, dropped links), so only import and
  # validate run here -- the parts that must work for any consumer.
  trestle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install "compliance-trestle==5.1.0"
      - name: Generate the plan from the fixtures
        run: |
          npm ci
          npm test >/dev/null
          node ssp.mjs test/fixtures/ssp/system.json > ssp.json
      - name: trestle import and validate
        # trestle resolves every import on import, and the fixtures name
        # example.org: the profile is pointed at the real BSI catalog at the
        # pinned commit, the plan at the profile inside the workspace.
        run: |
          mkdir ws && cd ws && trestle init
          CAT="https://raw.githubusercontent.com/BSI-Bund/Stand-der-Technik-Bibliothek/${BSI_COMMIT}/control_layer/Grundschutz%2B%2B/Grundschutz%2B%2B-resolved_catalog.json"
          jq --arg c "$CAT" '.profile.imports[0].href = $c' ../test/fixtures/ssp/profile.json > ../profile-local.json
          trestle import -f ../profile-local.json -o fixture-profile
          jq '.["system-security-plan"]["import-profile"].href = "trestle://profiles/fixture-profile/profile.json"' ../ssp.json > ../ssp-local.json
          trestle import -f ../ssp-local.json -o fixture
          trestle validate -a
